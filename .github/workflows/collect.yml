# Downloads WoW: Forever auction prices and saves them to this repository.
# Blizzard refreshes its snapshot about once an hour. GitHub sometimes delays or skips
# scheduled runs when it's busy, so this checks every 15 minutes; a run that finds no new
# snapshot doesn't make a commit.
# Needs two repository secrets: BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET.
name: Collect prices

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Los_Angeles # archive files are named by your local date
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download prices
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          FAH_REGION: us
          FAH_RULESET: '1'
          FAH_HOUSES: '113'
        run: node fetch-prices.mjs update

      - name: Look up new item names
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          FAH_REGION: us
        run: node fetch-prices.mjs items

      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive history.json data
          if git diff --cached --quiet; then
            echo "No new data."
            exit 0
          fi
          git commit -m "Prices $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
